name: One-time cleanup of merged branches

on:
  push:
    paths:
      - '.github/workflows/one-time-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only fully merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
          'develop'
          'portfolio/bilingual-docs-and-verified-build-2026'
          )
          for branch in "${branches[@]}"; do
            [[ "$branch" != 'main' ]] || exit 1
            sha=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')
            ahead=$(gh api "repos/$REPO/compare/main...$sha" --jq '.ahead_by')
            if [[ "$ahead" != 0 ]]; then
              echo "Refusing to delete unmerged branch $branch (ahead_by=$ahead)"
              exit 1
            fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            echo "Deleted merged branch $branch"
          done
